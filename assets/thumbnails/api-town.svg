<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f1a"/>
      <stop offset="1" stop-color="#232345"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- 街のビル群 -->
  <g fill="#818cf8" opacity="0.12">
    <rect x="20" y="240" width="70" height="120"/>
    <rect x="110" y="200" width="60" height="160"/>
    <rect x="190" y="260" width="50" height="100"/>
    <rect x="400" y="250" width="55" height="110"/>
    <rect x="470" y="210" width="65" height="150"/>
    <rect x="550" y="240" width="70" height="120"/>
  </g>
  <!-- ビルの窓 -->
  <g fill="#fbbf24" opacity="0.35">
    <rect x="126" y="216" width="10" height="10"/>
    <rect x="146" y="240" width="10" height="10"/>
    <rect x="486" y="226" width="10" height="10"/>
    <rect x="510" y="250" width="10" height="10"/>
    <rect x="36" y="256" width="10" height="10"/>
    <rect x="566" y="256" width="10" height="10"/>
  </g>

  <text x="320" y="118" font-size="76" text-anchor="middle">🏙️</text>
  <text x="320" y="212" text-anchor="middle" fill="url(#title)"
        font-family="Inter, 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="64" font-weight="800"
        letter-spacing="2">API TOWN</text>
  <text x="320" y="256" text-anchor="middle" fill="#c7cbe8"
        font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="25" font-weight="700">～おとなのWeb API職業体験～</text>
  <text x="320" y="302" text-anchor="middle" fill="#8b93b8"
        font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16">セールスも、CSも。プログラミング知識はいりません。</text>
</svg>
